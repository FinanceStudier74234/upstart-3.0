[project]
name = "upst-quant-hub"
version = "3.0.0"
description = "Institutional-grade quantitative finance platform for UPST"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "redis>=5.0",
    "apscheduler>=3.10",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "yfinance>=0.2",
    "aiofiles>=23.2",
    "orjson>=3.9",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx", "ruff>=0.3", "mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
